<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Countdown - Celebration Demo</title>
    <meta name="description" content="Demo of the celebration animation when countdown reaches zero">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-animation">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
        <div class="gradient-orb orb-4"></div>
    </div>

    <div class="particles" id="particles"></div>

    <div class="container">
        <header class="header">
            <h1 class="title">
                <span class="title-text" id="titlePrefixDisplay">Countdown to</span>
                <div class="year-container">
                    <div class="year-aura"></div>
                    <span class="year-highlight" id="yearDisplayDisplay">2025</span>
                    <div class="title-sparkles" id="title-sparkles"></div>
                </div>
            </h1>
            <p class="subtitle" id="subtitleDisplay">A New Era Begins</p>
        </header>

        <!-- Visitor Identity UI -->
        <div class="identity-panel">
            <button class="name-entry-btn" id="nameEntryBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span id="displayName">Set Name</span>
            </button>
            <div class="name-input-overlay" id="nameInputOverlay">
                <h3>Vibe Check</h3>
                <p>Choose your display name (3-8 characters)</p>
                <div class="input-wrapper">
                    <input type="text" class="visitor-name-input" id="visitorNameInput" placeholder="Enter name..."
                        maxlength="12">
                    <div class="validation-message" id="validationMessage">Invalid name</div>
                </div>
                <button class="save-name-btn" id="saveNameBtn">JOIN THE PARTY</button>
                <button class="guest-name-btn" id="guestNameBtn">Continue as Guest</button>
            </div>
        </div>

        <!-- Live Visitors Indicator -->
        <div class="visitors-container" id="visitorsContainer">
            <div class="visitor-pulse"></div>
            <svg class="visitor-icon" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </svg>
            <span class="visitor-count" id="visitorCount">1</span>
            <span class="visitor-label">watching now</span>
        </div>

        <main class="countdown-section">
            <div class="countdown-grid celebration">
                <div class="time-card">
                    <div class="time-value">00</div>
                    <div class="time-label">Days</div>
                </div>
                <div class="time-separator">:</div>
                <div class="time-card">
                    <div class="time-value">00</div>
                    <div class="time-label">Hours</div>
                </div>
                <div class="time-separator">:</div>
                <div class="time-card">
                    <div class="time-value">00</div>
                    <div class="time-label">Minutes</div>
                </div>
                <div class="time-separator">:</div>
                <div class="time-card">
                    <div class="time-value">00</div>
                    <div class="time-label">Seconds</div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" style="width: 100%;"></div>
            </div>

            <div class="message-container">
                <p class="countdown-message" id="message">Time until 2026</p>
            </div>
        </main>

        <footer class="footer">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value">0</div>
                    <div class="stat-label">Total Seconds</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">100.00%</div>
                    <div class="stat-label">Year Progress</div>
                </div>
            </div>
        </footer>
    </div>

    <div id="finalCountdown" class="final-countdown"></div>
    <canvas id="fireworks"></canvas>

    <!-- Walking People Container -->
    <div class="walking-people-container" id="walkingPeopleContainer"></div>

    <!-- Firebase SDK for Real-time Presence -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        // ============================================================
        // 🆔 VISITOR IDENTITY & FILTERING
        // ============================================================
        let visitorName = localStorage.getItem('visitorName') || 'Guest';
        document.getElementById('displayName').textContent = visitorName;

        const sensitiveWords = [
            // English (Common inappropriate terms)
            'fuck', 'shit', 'asshole', 'bitch', 'bastard', 'cunt', 'dick', 'pussy', 'nazi', 'racist',
            // Chinese (Common inappropriate/sensitive terms)
            '操', '傻逼', '贱', '骚', '叼', '反共', '法轮', '独', '死', '猪',
            // Malay (Common inappropriate terms)
            'pukimak', 'babi', 'lancap', 'pantat', 'anjing', 'bodoh', 'sial', 'gampang'
        ];

        function isSensitive(name) {
            const lowerName = name.toLowerCase();
            // Check for direct matches and character containment for Chinese
            for (const word of sensitiveWords) {
                if (lowerName.includes(word.toLowerCase())) return true;
            }
            return false;
        }

        const nameEntryBtn = document.getElementById('nameEntryBtn');
        const nameInputOverlay = document.getElementById('nameInputOverlay');
        const visitorNameInput = document.getElementById('visitorNameInput');
        const saveNameBtn = document.getElementById('saveNameBtn');
        const validationMessage = document.getElementById('validationMessage');

        const guestNameBtn = document.getElementById('guestNameBtn');

        nameEntryBtn.onclick = () => {
            nameInputOverlay.classList.toggle('active');
            nameEntryBtn.classList.toggle('active');
            if (nameInputOverlay.classList.contains('active')) {
                visitorNameInput.value = visitorName !== 'Guest' ? visitorName : '';
                visitorNameInput.focus();
            }
        };

        const handleNameUpdate = (newName) => {
            visitorName = newName;
            localStorage.setItem('visitorName', visitorName);
            document.getElementById('displayName').textContent = visitorName;
            nameInputOverlay.classList.remove('active');
            nameEntryBtn.classList.remove('active');

            // Immediate local sync
            if (typeof updateVisitorDisplay === 'function') {
                updateVisitorDisplay(currentVisitors, []); // Trigger sync with local names
            }

            if (firebaseInitialized && typeof myPresenceRef !== 'undefined') {
                myPresenceRef.update({ name: visitorName });
            }
        };

        saveNameBtn.onclick = () => {
            const inputName = visitorNameInput.value.trim();

            // Validation: 3-8 characters
            if (inputName.length < 3 || inputName.length > 8) {
                showError('Name must be 3-8 letters!');
                return;
            }

            // Filtering
            if (isSensitive(inputName)) {
                showError('Name contains sensitive words!');
                return;
            }

            handleNameUpdate(inputName);
        };

        if (guestNameBtn) {
            guestNameBtn.onclick = () => {
                handleNameUpdate('Guest');
            };
        }

        function showError(msg) {
            validationMessage.textContent = msg;
            validationMessage.classList.add('active');
            visitorNameInput.classList.add('error');
            setTimeout(() => {
                validationMessage.classList.remove('active');
                visitorNameInput.classList.remove('error');
            }, 3000);
        }

        // ============================================================
        // 🔥 FIREBASE CONFIGURATION - PASTE YOUR CONFIG HERE 🔥
        // ============================================================
        // Get this from Firebase Console > Project Settings > Your Apps
        const firebaseConfig = {
            apiKey: "AIzaSyAltjrs6pR3XLvvawYeLkYvCdNAUyCiuDM",
            authDomain: "countdown-5719c.firebaseapp.com",
            databaseURL: "https://countdown-5719c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "countdown-5719c",
            storageBucket: "countdown-5719c.firebasestorage.app",
            messagingSenderId: "252724445912",
            appId: "1:252724445912:web:04876fb7e709e9fe7d8dad",
            measurementId: "G-JHPD9JXC0Q"
        };
        // ============================================================

        // Check if Firebase is configured
        const isFirebaseConfigured = firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY";

        let firebaseInitialized = false;
        let connectionSuccessful = false;
        let currentVisitors = 1;
        let myPresenceRef; // Global ref

        if (isFirebaseConfigured) {
            try {
                // Initialize Firebase
                firebase.initializeApp(firebaseConfig);
                const database = firebase.database();
                firebaseInitialized = true;

                // Unique session ID for this visitor
                const sessionId = 'visitor_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();

                // Reference to presence data
                const presenceRef = database.ref('presence');
                myPresenceRef = database.ref('presence/' + sessionId);
                const connectedRef = database.ref('.info/connected');

                // Track connection status
                connectedRef.on('value', (snapshot) => {
                    if (snapshot.val() === true) {
                        connectionSuccessful = true;
                        console.log('🔥 Firebase Connected Successfully');
                        document.getElementById('visitorsContainer')?.classList.add('status-live');
                        document.getElementById('visitorsContainer')?.classList.remove('status-simulated', 'status-error');

                        // Connected - add presence
                        myPresenceRef.set({
                            connected: true,
                            name: visitorName, // Include initial name
                            timestamp: firebase.database.ServerValue.TIMESTAMP
                        }).catch(err => {
                            console.error('❌ Firebase Write Error (Check Rules):', err);
                            document.getElementById('visitorsContainer')?.classList.add('status-error');
                        });

                        // Remove presence when disconnected
                        myPresenceRef.onDisconnect().remove();
                    } else {
                        console.log('📡 Firebase Disconnected');
                    }
                }, (err) => {
                    console.error('❌ Firebase Connection Error:', err);
                    document.getElementById('visitorsContainer')?.classList.add('status-error');
                });

                // Listen for presence changes
                presenceRef.on('value', (snapshot) => {
                    const presenceData = snapshot.val();
                    const count = presenceData ? Object.keys(presenceData).length : 1;
                    currentVisitors = Math.max(1, count);

                    // Extract names for walking people sync
                    const names = [];
                    if (presenceData) {
                        Object.values(presenceData).forEach(visitor => {
                            if (visitor.name) names.push(visitor.name);
                        });
                    }

                    updateVisitorDisplay(currentVisitors, names);
                }, (err) => {
                    console.error('❌ Firebase Read Error (Check Rules):', err);
                    if (err.code === 'PERMISSION_DENIED') {
                        console.warn('⚠️ ACTION REQUIRED: Update your Firebase Realtime Database Rules to allow read/write.');
                    }
                    document.getElementById('visitorsContainer')?.classList.add('status-error');
                });

                // Safety timeout: If no connection after 5 seconds, start simulation as fallback
                setTimeout(() => {
                    if (!connectionSuccessful) {
                        console.warn('⚠️ Firebase connection timeout - starting simulation');
                        startSimulation();
                    }
                }, 5000);

            } catch (error) {
                console.warn('❌ Firebase initialization failed:', error);
                firebaseInitialized = false;
                startSimulation();
            }
        } else {
            console.log('ℹ️ Firebase not configured - using simulated visitor count');
            startSimulation();
        }

        // Update visitor display function
        function updateVisitorDisplay(count, names = []) {
            const visitorCountElement = document.getElementById('visitorCount');
            if (visitorCountElement) {
                const displayCount = Math.max(1, count);
                const oldCount = parseInt(visitorCountElement.textContent) || 0;

                if (oldCount !== displayCount) {
                    visitorCountElement.textContent = displayCount;
                    visitorCountElement.style.animation = 'none';
                    setTimeout(() => {
                        visitorCountElement.style.animation = 'visitorPop 0.3s ease-out';
                    }, 10);
                }

                // Sync walking people with visitor count and names
                if (typeof syncWalkingPeopleCount === 'function') {
                    syncWalkingPeopleCount(displayCount, names);
                }
            }
        }

        // Fallback: Simulated count logic
        let simulationInterval;
        function startSimulation() {
            if (connectionSuccessful || simulationInterval) return;

            console.log('💡 Starting visitor simulation');
            document.getElementById('visitorsContainer')?.classList.add('status-simulated');
            document.getElementById('visitorsContainer')?.classList.remove('status-live');

            currentVisitors = Math.floor(Math.random() * 12) + 8;
            updateVisitorDisplay(currentVisitors);

            function simulateVisitorChange() {
                if (connectionSuccessful) {
                    clearInterval(simulationInterval);
                    return;
                }
                const change = Math.floor(Math.random() * 5) - 2;
                currentVisitors = Math.max(1, Math.min(99, currentVisitors + change));
                updateVisitorDisplay(currentVisitors);
                scheduleNextSimulation();
            }

            function scheduleNextSimulation() {
                const delay = (Math.random() * 8000) + 4000;
                simulationInterval = setTimeout(simulateVisitorChange, delay);
            }

            scheduleNextSimulation();
        }

        // ============================================================
        // 🚶 WALKING PEOPLE ANIMATION (Back and Forth)
        // ============================================================
        const walkingPeopleContainer = document.getElementById('walkingPeopleContainer');
        const visitorNames = ['Visitor', 'Guest', 'Friend', 'Watcher', 'Fan', 'User', 'You', 'Someone'];
        const walkingPeople = []; // Track all walking people

        // Create a walking person SVG
        function createPersonSVG() {
            return `
                <svg viewBox="0 0 24 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Head -->
                    <circle cx="12" cy="6" r="5" class="person-fill"/>
                    <!-- Body -->
                    <path d="M12 11 L12 24" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="person-fill" style="stroke: currentColor"/>
                    <ellipse cx="12" cy="18" rx="4" ry="6" class="person-fill"/>
                    <!-- Left Leg -->
                    <path d="M12 24 L8 36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="person-fill leg-l" style="stroke: currentColor" />
                    <!-- Right Leg -->
                    <path d="M12 24 L16 36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="person-fill leg-r" style="stroke: currentColor" />
                    <!-- Left Arm -->
                    <path d="M12 14 L6 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="person-fill arm-l" style="stroke: currentColor" />
                    <!-- Right Arm -->
                    <path d="M12 14 L18 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="person-fill arm-r" style="stroke: currentColor" />
                </svg>
            `;
        }

        // Walking person class for back-and-forth movement
        class WalkingPerson {
            constructor(name) {
                this.element = document.createElement('div');
                const colorNum = Math.floor(Math.random() * 8) + 1;
                this.name = name || visitorNames[Math.floor(Math.random() * visitorNames.length)];

                this.element.className = `walking-person person-color-${colorNum}`;
                this.element.innerHTML = `
                    <div class="person-body">${createPersonSVG()}</div>
                    <span class="person-tag">${this.name}</span>
                `;

                // Random starting position within the page
                this.x = Math.random() * (window.innerWidth - 50);
                this.speed = 0.5 + Math.random() * 1; // pixels per frame (0.5-1.5)
                this.direction = Math.random() > 0.5 ? 1 : -1; // 1 = right, -1 = left

                this.element.style.left = this.x + 'px';
                this.updateDirection();

                if (walkingPeopleContainer) {
                    walkingPeopleContainer.appendChild(this.element);
                }
            }

            updateName(newName) {
                if (newName && this.name !== newName) {
                    this.name = newName;
                    const tag = this.element.querySelector('.person-tag');
                    if (tag) tag.textContent = newName;
                }
            }

            updateDirection() {
                if (this.direction === -1) {
                    this.element.classList.add('facing-left');
                } else {
                    this.element.classList.remove('facing-left');
                }
            }

            update() {
                // Move in current direction
                this.x += this.speed * this.direction;

                // Bounce off edges
                const maxX = window.innerWidth - 40;
                const minX = 10;

                if (this.x >= maxX) {
                    this.x = maxX;
                    this.direction = -1;
                    this.updateDirection();
                } else if (this.x <= minX) {
                    this.x = minX;
                    this.direction = 1;
                    this.updateDirection();
                }

                this.element.style.left = this.x + 'px';
            }

            remove() {
                this.element.remove();
            }
        }

        // Spawn a walking person
        function spawnWalkingPerson(name) {
            if (!walkingPeopleContainer) return;
            if (walkingPeople.length >= 15) return; // Limit max people on screen

            const person = new WalkingPerson(name);
            walkingPeople.push(person);
            return person;
        }

        // Remove a walking person
        function removeWalkingPerson() {
            if (walkingPeople.length > 1) {
                const personToRemove = walkingPeople.pop();
                if (personToRemove) {
                    // Fade out before removing
                    personToRemove.element.style.opacity = '0';
                    personToRemove.element.style.transition = 'opacity 0.5s ease';
                    setTimeout(() => personToRemove.remove(), 500);
                }
            }
        }

        // Animation loop for all walking people
        function animateWalkingPeople() {
            walkingPeople.forEach(person => person.update());
            requestAnimationFrame(animateWalkingPeople);
        }

        // Sync walking people count with real visitor count
        function syncWalkingPeopleCount(targetCount, names = []) {
            // Ensure at least 1 person, max 15
            targetCount = Math.min(Math.max(targetCount, 1), 15);

            const currentCount = walkingPeople.length;

            if (currentCount < targetCount) {
                // Someone joined! Add new walking people
                const toAdd = targetCount - currentCount;
                for (let i = 0; i < toAdd; i++) {
                    setTimeout(() => {
                        const nameIndex = currentCount + i;
                        const name = names[nameIndex] || (nameIndex === 0 ? visitorName : null);
                        const newPerson = spawnWalkingPerson(name);
                        if (newPerson) {
                            // Flash effect for new person
                            newPerson.element.style.filter = 'brightness(1.5)';
                            setTimeout(() => {
                                if (newPerson && newPerson.element) {
                                    newPerson.element.style.filter = '';
                                }
                            }, 500);
                        }
                    }, i * 300);
                }
            } else if (currentCount > targetCount) {
                // Someone left! Remove extra walking people
                const toRemove = currentCount - targetCount;
                for (let i = 0; i < toRemove; i++) {
                    removeWalkingPerson();
                }
            }

            // Sync names of existing people
            if (names.length > 0) {
                walkingPeople.forEach((person, index) => {
                    if (names[index]) {
                        person.updateName(names[index]);
                    }
                });
            } else if (walkingPeople.length > 0) {
                // Fallback: at least sync the first person with the local name
                walkingPeople[0].updateName(visitorName);
            }
        }

        // Spawn initial people based on visitor count
        function initWalkingPeople() {
            const initialCount = Math.min(Math.max(currentVisitors, 1), 5);
            for (let i = 0; i < initialCount; i++) {
                setTimeout(() => spawnWalkingPerson(i === 0 ? visitorName : null), i * 300);
            }
            // Start animation loop
            animateWalkingPeople();
        }

        // Track countdown state
        let peopleAreSitting = false;
        let peopleAreWatching = false;

        // Make all people sit down
        function makePeopleSitDown() {
            if (peopleAreSitting) return;
            peopleAreSitting = true;
            console.log('🪑 Making people sit down, count:', walkingPeople.length);

            walkingPeople.forEach((person, index) => {
                setTimeout(() => {
                    if (person && person.element) {
                        person.element.classList.add('sitting');
                        person.element.classList.remove('facing-left', 'excited', 'watching-fireworks');
                        // Stop their movement
                        person.speed = 0;
                    }
                }, index * 100);
            });
        }

        // Make people excited during countdown
        function makePeopleExcited() {
            console.log('🎉 Making people excited!');
            walkingPeople.forEach(person => {
                if (person && person.element) {
                    person.element.classList.add('excited');
                    person.element.classList.remove('sitting');
                }
            });
        }

        // Make people watch fireworks
        function makePeopleWatchFireworks() {
            if (peopleAreWatching) return;
            peopleAreWatching = true;
            console.log('🎆 Making people watch fireworks!');

            walkingPeople.forEach((person, index) => {
                setTimeout(() => {
                    if (person && person.element) {
                        person.element.classList.remove('sitting', 'excited');
                        person.element.classList.add('watching-fireworks');
                    }
                }, index * 50);
            });
        }

        // Resume walking after celebration
        function makePeopleWalkAgain() {
            console.log('🚶 Making people walk again');
            peopleAreSitting = false;
            peopleAreWatching = false;

            walkingPeople.forEach((person, index) => {
                setTimeout(() => {
                    if (person && person.element) {
                        person.element.classList.remove('sitting', 'excited', 'watching-fireworks');
                        // Give them new random speed
                        person.speed = 0.5 + Math.random() * 1;
                        person.direction = Math.random() > 0.5 ? 1 : -1;
                        person.updateDirection();
                    }
                }, index * 200);
            });
        }

        // Expose functions globally for the countdown script to use
        window.makePeopleSitDown = makePeopleSitDown;
        window.makePeopleExcited = makePeopleExcited;
        window.makePeopleWatchFireworks = makePeopleWatchFireworks;
        window.makePeopleWalkAgain = makePeopleWalkAgain;

        // ============================================================
        // ✨ INTERACTIVE PEOPLE - CLICK & HOVER REACTIONS
        // ============================================================

        // Mobile detection for performance optimizations
        const isMobileInteractive = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

        const greetings = [
            "Happy New Year! 🎉",
            "Hey there! 👋",
            "Let's party! 🎊",
            "2026 here we come!",
            "Woo hoo! 🥳",
            "Hi friend!",
            "Can't wait! ⏰",
            "So excited! ✨",
            "Almost time! 🎆",
            "Yay! 🎈"
        ];

        const emotes = ['❤️', '🎉', '✨', '🌟', '🎊', '💫', '🎈', '🥳', '💖', '🎆'];

        // Add speech bubble to person element
        function addSpeechBubble(personElement) {
            if (!personElement.querySelector('.person-speech')) {
                const speech = document.createElement('div');
                speech.className = 'person-speech';
                speech.textContent = greetings[Math.floor(Math.random() * greetings.length)];
                personElement.appendChild(speech);
            }
        }

        // Show random emote above person
        function showEmote(personElement) {
            const emote = document.createElement('div');
            emote.className = 'person-emote';
            emote.textContent = emotes[Math.floor(Math.random() * emotes.length)];
            personElement.appendChild(emote);

            setTimeout(() => emote.remove(), 1500);
        }

        // Create heart burst effect at position - optimized for mobile
        function createHeartBurst(x, y) {
            const burst = document.createElement('div');
            burst.className = 'heart-burst';
            burst.style.left = x + 'px';
            burst.style.bottom = '60px';

            const hearts = ['❤️', '💕', '💖', '💗', '💝'];
            // Fewer hearts on mobile for better performance
            const heartCount = isMobileInteractive ? 3 : 6;
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('span');
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                const angle = (i / heartCount) * Math.PI * 2;
                const distance = isMobileInteractive ? (20 + Math.random() * 20) : (30 + Math.random() * 30);
                heart.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                heart.style.setProperty('--ty', Math.sin(angle) * distance - 40 + 'px');
                burst.appendChild(heart);
            }

            walkingPeopleContainer.appendChild(burst);
            setTimeout(() => burst.remove(), 1000);
        }

        // Handle person click with cooldown to prevent getting stuck
        function handlePersonClick(person, event) {
            if (!person || !person.element) return;

            // Prevent rapid clicking - check if already in cooldown
            if (person.isInteracting) return;
            person.isInteracting = true;

            const el = person.element;

            // Store original speed before stopping
            const originalSpeed = person.originalSpeed || person.speed || (0.5 + Math.random() * 1);
            person.originalSpeed = originalSpeed;
            person.speed = 0;

            // Clear any existing animation classes first
            el.classList.remove('jumping', 'waving', 'speaking', 'spinning', 'dancing', 'happy-bounce');

            // Add jump animation
            el.classList.add('jumping', 'waving');

            // Show speech bubble
            addSpeechBubble(el);
            el.classList.add('speaking');

            // Show emote
            showEmote(el);

            // Create heart burst
            createHeartBurst(person.x, 0);

            // Random chance to do a spin (20%)
            if (Math.random() < 0.2) {
                setTimeout(() => {
                    if (person.isInteracting) {
                        el.classList.add('spinning');
                        setTimeout(() => el.classList.remove('spinning'), 600);
                    }
                }, 500);
            }

            // Random chance to start dancing (30%)
            if (Math.random() < 0.3) {
                el.classList.add('dancing');
                setTimeout(() => el.classList.remove('dancing'), 2000);
            }

            // Reset after animations - use a single cleanup function
            setTimeout(() => {
                el.classList.remove('jumping', 'waving', 'speaking', 'spinning', 'dancing');
                person.speed = originalSpeed;
                person.isInteracting = false; // Release cooldown
            }, 1500);

            // Change speech bubble text each time
            const speech = el.querySelector('.person-speech');
            if (speech) {
                speech.textContent = greetings[Math.floor(Math.random() * greetings.length)];
            }
        }

        // Add click listeners to walking people container
        if (walkingPeopleContainer) {
            walkingPeopleContainer.addEventListener('click', (e) => {
                const personEl = e.target.closest('.walking-person');
                if (personEl) {
                    const person = walkingPeople.find(p => p.element === personEl);
                    if (person) {
                        handlePersonClick(person, e);
                    }
                }
            });

            // Hover effect - make nearby people look at cursor
            walkingPeopleContainer.addEventListener('mousemove', (e) => {
                const cursorX = e.clientX;
                walkingPeople.forEach(person => {
                    if (!person || !person.element) return;
                    const personX = person.x + 12; // Center of person
                    const distance = Math.abs(cursorX - personX);

                    // If close enough, make them "look" at cursor
                    if (distance < 100 && person.speed === 0) {
                        person.element.classList.add('looking');
                    } else {
                        person.element.classList.remove('looking');
                    }
                });
            });
        }

        // Random idle behaviors - people do random things occasionally
        function randomIdleBehavior() {
            if (walkingPeople.length === 0) return;

            const randomPerson = walkingPeople[Math.floor(Math.random() * walkingPeople.length)];
            if (!randomPerson || !randomPerson.element) return;

            const actions = ['emote', 'wave', 'jump', 'spin'];
            const action = actions[Math.floor(Math.random() * actions.length)];

            switch (action) {
                case 'emote':
                    showEmote(randomPerson.element);
                    break;
                case 'wave':
                    randomPerson.element.classList.add('waving');
                    setTimeout(() => randomPerson.element.classList.remove('waving'), 1000);
                    break;
                case 'jump':
                    randomPerson.element.classList.add('happy-bounce');
                    setTimeout(() => randomPerson.element.classList.remove('happy-bounce'), 600);
                    break;
                case 'spin':
                    randomPerson.element.classList.add('spinning');
                    setTimeout(() => randomPerson.element.classList.remove('spinning'), 600);
                    break;
            }
        }

        // Start random idle behaviors - less frequent on mobile for performance
        function scheduleIdleBehavior() {
            // Longer delays on mobile for better battery life and performance
            const baseDelay = isMobileInteractive ? 8000 : 5000;
            const randomDelay = isMobileInteractive ? 12000 : 10000;
            const delay = baseDelay + Math.random() * randomDelay;
            setTimeout(() => {
                randomIdleBehavior();
                scheduleIdleBehavior();
            }, delay);
        }

        // Start idle behaviors after initial load
        setTimeout(scheduleIdleBehavior, 3000);

        // Start walking people after page loads
        setTimeout(() => {
            initWalkingPeople();
        }, 1500);
    </script>

    <!-- Three.js Library and Post-processing -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // Mobile detection for performance optimizations
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        // Create particles (background dots) with mobile optimization
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            // Reduce particles on mobile for better performance
            const particleCount = isMobile ? 25 : 60;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = isMobile ? Math.random() * 2 + 1 : Math.random() * 3 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.2;
                particlesContainer.appendChild(particle);
            }
        }

        createParticles();

        // Create sparkles around the title
        function createTitleSparkle() {
            const container = document.getElementById('title-sparkles');
            if (!container) return;

            const sparkle = document.createElement('div');
            sparkle.className = 'title-sparkle';

            // Random position around the year
            const x = Math.random() * 100;
            const y = Math.random() * 100;

            sparkle.style.left = x + '%';
            sparkle.style.top = y + '%';

            const size = Math.random() * 6 + 2;
            sparkle.style.width = size + 'px';
            sparkle.style.height = size + 'px';

            container.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 1500);
        }

        // Reduce sparkle frequency on mobile
        setInterval(createTitleSparkle, isMobile ? 300 : 150);

        // Demo logic: swap year and wording from 2025 to 2026 for showcase
        const yearDisplay = document.getElementById('yearDisplayDisplay');
        const titlePrefix = document.getElementById('titlePrefixDisplay');
        const subtitle = document.getElementById('subtitleDisplay');
        const message = document.getElementById('message');
        const finalCountdownOverlay = document.getElementById('finalCountdown');
        const mainContainer = document.querySelector('.container');
        let lastFinalSecond = -1;

        // Three.js Engine State
        let scene, camera, renderer, composer;
        let fireworksActive = false;
        let fireworkInstances = [];
        let particleGroups = [];

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 800;

            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('fireworks'),
                antialias: !isMobile, // Disable antialiasing on mobile
                alpha: true,
                powerPreference: isMobile ? 'low-power' : 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Lower pixel ratio on mobile for better performance
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
            renderer.setClearColor(0x000000, 0); // Transparent clear color

            const renderScene = new RenderPass(scene, camera);

            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                isMobile ? 1.0 : 1.5, // Lower bloom on mobile
                0.4,
                0.85
            );

            composer = new EffectComposer(renderer);
            // Ensure internal buffers support transparency
            composer.renderTarget1.texture.format = THREE.RGBAFormat;
            composer.renderTarget2.texture.format = THREE.RGBAFormat;

            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        try {
            initThreeJS();
        } catch (e) {
            console.error("Three.js initialization failed:", e);
        }

        if (yearDisplay || true) { // Force start even if elements are missing
            // Delay start to allow walking people to initialize first
            setTimeout(() => {
                startDemo();
            }, 2500);
        }

        function startDemo() {
            // Reset UI
            if (yearDisplay) {
                yearDisplay.textContent = '2025';
                yearDisplay.classList.remove('year-flip');
            }
            if (titlePrefix) titlePrefix.textContent = 'Countdown to';
            if (subtitle) subtitle.textContent = 'A New Era Begins';
            if (message) {
                message.textContent = 'Time until 2026';
                message.classList.remove('celebration-message');
            }
            document.body.style.animation = 'none';

            // Hidden overlay initially
            if (finalCountdownOverlay) finalCountdownOverlay.style.display = 'none';
            if (mainContainer) mainContainer.classList.remove('ui-dimmed');

            // Reset grid values
            updateGridDemo(10);

            // Reset Three.js State
            fireworksActive = false;
            fireworkInstances = [];
            // Cleanup existing particle groups in scene
            if (particleGroups) {
                particleGroups.forEach(group => {
                    scene.remove(group.points);
                    group.points.geometry.dispose();
                    group.points.material.dispose();
                });
            }
            particleGroups = [];

            // Make people walk again at start of demo loop
            if (typeof window.makePeopleWalkAgain === 'function') {
                window.makePeopleWalkAgain();
            }

            // Demo sequence:
            // Start with 10 seconds remaining IMMEDIATELY
            let demoDistance = 10000;

            // First tick immediately - people sit down for the countdown!
            showFinalCountdownDemo(10);
            updateGridDemo(10);

            // Make walking people sit down when countdown starts
            if (typeof window.makePeopleSitDown === 'function') {
                window.makePeopleSitDown();
            }

            const demoInterval = setInterval(() => {
                demoDistance -= 1000;

                if (demoDistance > 0) {
                    const secs = Math.ceil(demoDistance / 1000);
                    showFinalCountdownDemo(secs);
                    updateGridDemo(secs);

                    // Make people excited in the last 3 seconds
                    if (secs <= 3 && typeof window.makePeopleExcited === 'function') {
                        window.makePeopleExcited();
                    }
                } else {
                    clearInterval(demoInterval);
                    updateGridDemo(0);
                    triggerCelebrationDemo();

                    // Make people watch the fireworks!
                    if (typeof window.makePeopleWatchFireworks === 'function') {
                        window.makePeopleWatchFireworks();
                    }

                    // Start fireworks only after countdown
                    startFireworksDemo();

                    // Restart demo after 12 seconds of celebration
                    setTimeout(startDemo, 12000);
                }
            }, 1000);
        }

        function updateGridDemo(secs) {
            const timeValues = document.querySelectorAll('.time-value');
            if (timeValues.length >= 4) {
                timeValues[3].textContent = secs < 10 ? '0' + secs : secs;
                timeValues[0].textContent = '00';
                timeValues[1].textContent = '00';
                timeValues[2].textContent = '00';
            }

            // Update stats
            const statValues = document.querySelectorAll('.stat-value');
            if (statValues.length >= 2) {
                statValues[0].textContent = secs; // Total Seconds
                // Calculate pseudo progress (e.g., 99.99% decreasing to 100%?)
                // Or just show 99.99...%
                const progress = (100 - (secs / 31536000) * 100).toFixed(4);
                statValues[1].textContent = progress + '%';
            }
        }



        function showFinalCountdownDemo(seconds) {
            if (seconds === lastFinalSecond || seconds <= 0) return;
            lastFinalSecond = seconds;

            if (finalCountdownOverlay) {
                finalCountdownOverlay.style.display = 'flex';
                finalCountdownOverlay.innerHTML = `<div class="countdown-number" data-number="${seconds}">${seconds}</div>`;

                if (mainContainer) {
                    mainContainer.classList.add('ui-dimmed');
                }

                if (seconds <= 3) {
                    document.body.style.animation = 'none';
                    setTimeout(() => {
                        document.body.style.animation = 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both';
                    }, 10);
                }
            }
        }

        function triggerCelebrationDemo() {
            // Hide final countdown overlay immediately
            if (finalCountdownOverlay) {
                finalCountdownOverlay.style.display = 'none';
            }
            if (mainContainer) {
                mainContainer.classList.remove('ui-dimmed');
            }

            const yearDisplay = document.getElementById('yearDisplayDisplay');
            const titlePrefix = document.getElementById('titlePrefixDisplay');
            const subtitle = document.getElementById('subtitleDisplay');
            const message = document.getElementById('message');

            if (yearDisplay) {
                yearDisplay.classList.add('year-flip');
                setTimeout(() => {
                    yearDisplay.textContent = '2026';
                    if (titlePrefix) titlePrefix.textContent = 'Happy New Year';
                    if (subtitle) subtitle.textContent = 'Welcome to 2026!';
                    if (message) {
                        message.textContent = '🎉 Welcome to 2026! 🎉';
                        message.classList.add('celebration-message');
                    }
                }, 500);
            }
        }

        // Add mouse move parallax effect
        document.addEventListener('mousemove', (e) => {
            const orbs = document.querySelectorAll('.gradient-orb');
            const x = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            const y = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);

            orbs.forEach((orb, index) => {
                const factor = (index + 1) * 30;
                const xOffset = x * factor;
                const yOffset = y * factor;
                const rotate = x * 10;
                orb.style.transform = `translate(${xOffset}px, ${yOffset}px) rotate(${rotate}deg)`;
            });
        });

        // Continuously trigger celebration animation with staggered effect
        setInterval(() => {
            const grid = document.querySelector('.countdown-grid');
            grid.style.animation = 'none';
            setTimeout(() => {
                grid.style.animation = 'celebrate 1.2s cubic-bezier(0.4, 0, 0.2, 1)';
            }, 10);
        }, 3000);

        // Three.js Firework Class
        class FireworkInstance {
            constructor() {
                this.hue = Math.random() * 360;
                this.color = new THREE.Color(`hsl(${this.hue}, 100%, 60%)`);

                // Starting position (bottom of screen in 3D)
                const x = (Math.random() - 0.5) * 1000;
                const y = -600;
                const z = (Math.random() - 0.5) * 400;

                this.position = new THREE.Vector3(x, y, z);
                this.targetY = (Math.random() * 400) + 100;
                this.velocity = new THREE.Vector3((Math.random() - 0.5) * 3, 12 + Math.random() * 5, (Math.random() - 0.5) * 2);
                this.gravity = 0.15;
                this.exploded = false;
                this.explosionType = Math.floor(Math.random() * 3);

                // Rocket sprite
                const spriteMap = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png');
                const material = new THREE.SpriteMaterial({
                    map: spriteMap,
                    color: this.color,
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });
                this.sprite = new THREE.Sprite(material);
                this.sprite.scale.set(15, 15, 1);
                this.sprite.position.copy(this.position);
                scene.add(this.sprite);
            }

            update() {
                if (!this.exploded) {
                    this.velocity.y -= this.gravity;
                    this.position.add(this.velocity);
                    this.sprite.position.copy(this.position);

                    // Explode if reached peak or target
                    if (this.velocity.y <= 0 || this.position.y >= this.targetY) {
                        this.explode();
                    }
                }
            }

            explode() {
                this.exploded = true;
                scene.remove(this.sprite);
                createThreeJSExplosion(this.position, this.hue, this.explosionType);
            }
        }

        function createThreeJSExplosion(position, hue, type) {
            // Reduce explosion particles on mobile for smoother animation
            const count = isMobile ? 150 : 300;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = [];
            const colors = new Float32Array(count * 3);
            const baseColor = new THREE.Color(`hsl(${hue}, 100%, 70%)`);

            for (let i = 0; i < count; i++) {
                positions[i * 3] = position.x;
                positions[i * 3 + 1] = position.y;
                positions[i * 3 + 2] = position.z;

                let vx, vy, vz;
                if (type === 0) { // Volumetric Sphere
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    const speed = 4 + Math.random() * 8;
                    vx = Math.sin(phi) * Math.cos(theta) * speed;
                    vy = Math.sin(phi) * Math.sin(theta) * speed;
                    vz = Math.cos(phi) * speed;
                } else if (type === 1) { // 3D Heart
                    const t = (i / count) * Math.PI * 2;
                    vx = 16 * Math.pow(Math.sin(t), 3);
                    vy = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                    vz = (Math.random() - 0.5) * 10;
                    const speed = 0.5;
                    vx *= speed; vy *= speed;
                } else { // 3D Star
                    const points = 5;
                    const t = (i / count) * Math.PI * 2 * points;
                    const r = (Math.floor((i / count) * points * 2) % 2 === 0) ? 10 : 5;
                    vx = Math.cos(t) * r;
                    vy = Math.sin(t) * r;
                    vz = (Math.random() - 0.5) * 10;
                }

                velocities.push(new THREE.Vector3(vx, vy, vz));
                colors[i * 3] = baseColor.r;
                colors[i * 3 + 1] = baseColor.g;
                colors[i * 3 + 2] = baseColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 8,
                vertexColors: true,
                transparent: true,
                opacity: 1,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);
            particleGroups.push({
                points,
                velocities,
                life: 1.0,
                decay: 0.005 + Math.random() * 0.01
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            // Update Rockets
            for (let i = fireworkInstances.length - 1; i >= 0; i--) {
                const fw = fireworkInstances[i];
                fw.update();
                if (fw.exploded) {
                    fireworkInstances.splice(i, 1);
                }
            }

            // Update Particle Groups
            for (let i = particleGroups.length - 1; i >= 0; i--) {
                const group = particleGroups[i];
                const posAttr = group.points.geometry.attributes.position;

                group.life -= group.decay;
                group.points.material.opacity = group.life;

                for (let j = 0; j < group.velocities.length; j++) {
                    const v = group.velocities[j];
                    posAttr.array[j * 3] += v.x;
                    posAttr.array[j * 3 + 1] += v.y;
                    posAttr.array[j * 3 + 2] += v.z;

                    v.y -= 0.1; // gravity
                    v.multiplyScalar(0.97); // friction
                }
                posAttr.needsUpdate = true;

                if (group.life <= 0) {
                    scene.remove(group.points);
                    group.points.geometry.dispose();
                    group.points.material.dispose();
                    particleGroups.splice(i, 1);
                }
            }

            composer.render();
        }

        animate();

        function launchFirework() {
            if (fireworksActive) {
                fireworkInstances.push(new FireworkInstance());
            }
        }

        function startFireworksDemo() {
            fireworksActive = true;

            // Interval for regular launches
            const launchInterval = setInterval(() => {
                if (fireworksActive) {
                    launchFirework();
                } else {
                    clearInterval(launchInterval);
                }
            }, 600);

            // Occasional bursts of multiple fireworks
            const burstInterval = setInterval(() => {
                if (fireworksActive) {
                    for (let i = 0; i < 4; i++) {
                        setTimeout(() => launchFirework(), i * 150);
                    }
                } else {
                    clearInterval(burstInterval);
                }
            }, 3000);
        }
    </script>

        .celebration-message {

        }

            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .title-sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff, 0 0 20px #4facfe;
            animation: sparkle-anim 1.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes sparkle-anim {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: scale(1.5) rotate(180deg);
                opacity: 0;
            }
        }

        .year-aura {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.2) 0%, transparent 70%);
            z-index: -1;
            animation: aura-pulse 4s ease-in-out infinite;
            filter: blur(20px);
        }

        @keyframes aura-pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.8;
            }
        }

        /* Shake animation for last seconds */
        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        .ui-dimmed {
            opacity: 0.3;
            filter: blur(5px);
            transition: opacity 1s ease, filter 1s ease;
        }

        /* Final Countdown Overlay */
        .final-countdown {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: radial-gradient(circle, transparent 0%, rgba(5, 8, 26, 0.4) 100%);
            pointer-events: none;
        }

        .countdown-number {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(10rem, 30vw, 25rem);
            font-weight: 900;
            background: linear-gradient(135deg, #ffd89b 0%, #ffffff 50%, #ffd89b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(255, 216, 155, 0.5));
            animation: numberPop 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
        }

        .countdown-number::before {
            content: attr(data-number);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            -webkit-text-stroke: 4px rgba(255, 255, 255, 0.1);
            filter: blur(20px);
        }

        @keyframes numberPop {
            0% {
                transform: scale(0.5);
                opacity: 0;
                filter: brightness(0.5) blur(10px);
            }

            30% {
                opacity: 1;
                filter: brightness(1.5) blur(0px);
            }

            100% {
                transform: scale(1.1);
                opacity: 0;
                filter: brightness(1) blur(20px);
            }
        }
    </style>
